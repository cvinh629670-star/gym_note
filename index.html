<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#191629"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="DZ Gym"><title>DZ Gym Log</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet"><style>
:root{--ink:#0d1a33;--mute:#5b6b88;--line:#dde5f2;--bg:#eaf0fb;--paper:#f5f8fd;--push:#ff5a5f;--push2:#ff9068;--pull:#2f7cf6;--pull2:#5fb2ff;--leg:#12a874;--leg2:#4fd9a2;color-scheme:light;font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.dark::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:linear-gradient(#000,transparent 75%);mask-image:linear-gradient(#000,transparent 75%)}

.header{padding:26px 20px 24px}.calhead{padding:24px 18px 36px}

.workcard:active{transform:scale(.98)}
.push{--sh:#ff5a5f;background:linear-gradient(120deg,var(--push),var(--push2))}

.viewmonth{width:100%;margin-top:12px;padding:13px;border-radius:14px;background:#fff;border:1px solid var(--line);color:#1a3c67;font-family:inherit;font-weight:600}

.calendar{position:relative;margin-top:-20px;min-height:68vh;padding:18px 16px 30px;background:var(--paper);border-radius:26px 26px 0 0;box-shadow:0 -10px 30px #0a12261c}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.weekday{padding:8px 0;font-size:12px;font-weight:700;color:var(--mute)}
.day{min-height:48px;display:grid;align-content:center;justify-items:center;gap:4px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-family:inherit;font-size:14px;font-weight:650}
.day.selected{border-color:transparent;color:#fff;background:linear-gradient(140deg,#4a97ff,#2358d6);box-shadow:0 10px 18px -8px #2f7cf6}
.dots{display:flex;justify-content:center;gap:3px;height:5px}.dot{width:5px;height:5px;border-radius:50%}.day.selected .dot{box-shadow:0 0 0 1.5px #fff}
.legend{display:flex;gap:16px;margin:20px 0 16px;font-size:12px;font-weight:600;color:var(--mute)}.legend span{display:flex;align-items:center;gap:6px}
.stats{padding:16px;border-radius:16px;font-size:14px;color:var(--ink);background:linear-gradient(135deg,#e3edff,#f1f6ff);border:1px solid #d3e1fb}.stats strong{font-size:26px;color:#2358d6}
.settings{padding:22px 20px;background:var(--paper);color:var(--ink)}.settings h2{margin:0 0 6px;font-size:20px}
.settings button{display:block;width:100%;margin:12px 0;padding:15px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);text-align:left;font-family:inherit;font-size:14px;font-weight:600}
.settings .danger{color:#d23b43}
.srow{display:flex;align-items:center;gap:14px;margin:12px 0;padding:14px;background:#fff;border:1px solid var(--line);border-radius:18px}
.srow i{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:23px;color:#fff;font-style:normal;flex:none}
.srow>div{flex:1}.srow strong{display:block;margin-bottom:9px}.srow .bar{background:#e6edf9}.srow b{font-size:22px}
.keypad-overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:#07142699;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.keypad-panel{width:min(460px,100%);padding:16px 18px calc(18px + env(safe-area-inset-bottom));background:var(--paper);color:var(--ink);border-radius:28px 28px 0 0;box-shadow:0 -18px 40px #0004;animation:kp .22s ease-out}
@keyframes kp{from{transform:translateY(40px);opacity:0}}
.keypad-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.keypad-title{font-size:14px;font-weight:750}.keypad-sub{font-size:12px;color:var(--mute);margin-top:3px}
.keypad-close{border:0;background:#e6ecf8;color:var(--ink);border-radius:11px;width:38px;height:38px;font-size:20px}
.keypad-display{min-height:60px;margin-bottom:12px;padding:10px;font-size:32px;font-weight:800;text-align:center;color:#10203e;background:#e9f0fc;border:1px solid #d3e0f6;border-radius:16px}
.keypad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.keypad-grid button{min-height:58px;border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--ink);font-family:inherit;font-size:24px;font-weight:700;box-shadow:0 2px 0 #dde5f2;touch-action:manipulation}
.keypad-grid button:active{background:#dbeafe;transform:translateY(1px);box-shadow:none}.keypad-grid .key-del{background:#e6ecf8}
.keypad-actions{display:flex;gap:9px;margin-top:10px}
.keypad-actions button{flex:1;border:0;border-radius:14px;padding:14px;background:#e6ecf8;color:#172a47;font-family:inherit;font-size:15px;font-weight:700}
.keypad-actions .key-done{background:linear-gradient(140deg,#4a97ff,#2358d6)!important;box-shadow:0 10px 18px -8px #2f7cf6}
.hide{display:none!important}
button:focus-visible,input:focus-visible{outline:2px solid #2b7cf0;outline-offset:2px}
@media(max-width:360px){.exercise,.tablehead{grid-template-columns:20px minmax(0,1fr) 42px 42px 48px;gap:4px}.paper{padding-inline:9px}}
@media(max-height:630px){.keypad-panel{padding-top:9px}.keypad-grid button{min-height:42px}.keypad-display{font-size:23px;padding:6px;min-height:40px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.exercise{display:block;padding:12px 10px}
.exhead{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.exbody{display:grid;grid-template-columns:minmax(0,1.25fr) 48px 48px 56px;gap:6px;align-items:stretch}
.exbody input{min-height:54px;padding:0}
.prevcol{display:grid;align-content:center;gap:1px;min-width:0;padding:6px 9px;border-radius:11px;background:#eef3fb;border:1px dashed #c7d4ea}
.prevcol small{font-size:10.5px;font-weight:600;color:var(--mute)}.prevcol b{font-size:15px;color:var(--ink)}.prevcol em{font-style:normal;font-size:12px;font-weight:600;color:var(--mute)}
.sug{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;margin-top:9px;padding:8px 8px 8px 11px;border:1px solid color-mix(in srgb,var(--ac) 40%,white);border-radius:12px;background:color-mix(in srgb,var(--ac) 9%,white);color:var(--ink);font-family:inherit;font-size:12.5px;text-align:left}
.sug span{flex:none;padding:6px 13px;border-radius:9px;background:var(--ac);color:#fff;font-size:12px;font-weight:700}
.sugall{width:100%;margin:6px 0 4px;padding:13px;border:1.5px solid var(--ac);border-radius:14px;background:#fff;color:var(--ink);font-family:inherit;font-size:13.5px;font-weight:700}
.srow small{font-weight:500}
@media(max-width:360px){.exbody{grid-template-columns:minmax(0,1fr) 42px 42px 48px}}
html{-webkit-text-size-adjust:100%}body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.header,.top{padding-top:calc(env(safe-area-inset-top) + 22px)}
@media(max-width:480px),(display-mode:standalone){.app{box-shadow:none}}
.filebtn{display:block;margin:12px 0;padding:15px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-size:14px;font-weight:600;cursor:pointer}
.settings .install{color:#fff;border:0;background:linear-gradient(140deg,#4a97ff,#2358d6);box-shadow:0 12px 22px -12px #2f7cf6}

/* DZ Gym Log — shared interface */
:root {
  --ink: #f0f3f4;
  --mute: #adb7bf;
  --line: #333c44;
  --bg: #101417;
  --paper: #171c20;
  --panel: #20272c;
  --lime: #d1f67a;
  --push: #ff9b87;
  --push2: #ffb8a8;
  --pull: #8ebcff;
  --pull2: #b4d3ff;
  --leg: #a6e1ac;
  --leg2: #c4f0c8;
  color-scheme: dark;
}
body {
  background: radial-gradient(ellipse at top, #27332a, transparent 42rem), var(--bg);
}
.app {
  --content-width: 960px;
  width: min(100%, var(--content-width));
  max-width: none;
  min-height: 100dvh;
  padding-bottom: calc(84px + env(safe-area-inset-bottom));
  border-inline: 1px solid #ffffff0e;
  box-shadow: none;
}
.dark, .top {
  background: radial-gradient(ellipse at 100% 0%, #34412d, transparent 68%), #1b2223;
}
.dark::before, .top::before, .top::after { display: none; }
.dark:not(.header):not(.calhead) { min-height: auto; }
.header, .top, .settings, .paper {
  padding-inline: clamp(16px, 5vw, 44px);
}
.header, .top { padding-top: calc(env(safe-area-inset-top) + 32px); }
.header { padding-bottom: 24px; }
.header h1, .top h2 {
  color: var(--ink);
  font-size: clamp(26px, 5vw, 40px);
  line-height: 1.12;
  letter-spacing: -.045em;
}
.brand { gap: 14px; }
.logo {
  width: 54px;
  height: 54px;
  border-radius: 16px;
  background: var(--lime);
  color: #202b13;
  box-shadow: none;
}
.sub { margin-top: 6px; color: var(--mute); }
.range {
  width: fit-content;
  margin-top: 22px;
  padding: 10px 13px;
  border-radius: 10px;
  color: var(--ink);
  background: #141a19;
  border-color: #ffffff1f;
  font-size: 12px;
}
.range .i { color: var(--lime); font-size: 16px; }
.push { --accent: var(--push); }
.pull { --accent: var(--pull); }
.leg { --accent: var(--leg); }
.cards {
  margin: 0;
  padding: 0 clamp(16px, 5vw, 44px) 32px;
  gap: 12px;
}
.workcard {
  min-height: 112px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 18px;
  color: var(--ink);
  background: linear-gradient(120deg, color-mix(in srgb, var(--accent) 12%, var(--panel)), var(--panel) 75%);
  box-shadow: none;
}
.workcard .emoji, .ticon, .srow i {
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 15%, var(--panel));
  border: 1px solid color-mix(in srgb, var(--accent) 27%, var(--panel));
}
.workcard .emoji { width: 48px; height: 48px; border-radius: 13px; }
.wbg { display: none; }
.workcard small { color: var(--mute); line-height: 1.45; }
.workcard .arrow { color: var(--accent); }
.bar, .srow .bar { height: 4px; background: #ffffff21; }
.bar u { background: var(--accent, var(--lime)); }
.foot {
  width: min(100%, 960px);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  background: #171c20f5;
  border-color: var(--line);
}
.foot button {
  flex: 1;
  min-height: 54px;
  align-content: center;
  color: var(--mute);
}
.foot button.active { color: var(--lime); }
.foot button.active span { background: #d1f67a22; }
.top { padding-bottom: 30px; border-bottom: 1px solid var(--line); }
.top p { color: var(--mute); }
.back, .keypad-close {
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  cursor: pointer;
}
.paper {
  margin-top: 0;
  padding-top: 16px;
  border-radius: 0;
  box-shadow: none;
}
.exercise, .srow, .settings button, .settings .filebtn {
  color: var(--ink);
  background: var(--panel);
  border-color: var(--line);
  border-radius: 14px;
}
.exercise { padding: 13px; margin-top: 12px; }
.exercise label { font-size: 14px; }
.exercise .n { border-radius: 7px; background: #343e46; }
.exercise.done .n { color: #101417; }
.exbody { grid-template-columns: minmax(0, 1.45fr) repeat(3, minmax(0, 1fr)); }
.prevcol, .exercise input, .exercise input:focus {
  background: #161b1f;
  border-color: #45515a;
}
.exercise input {
  color: var(--ink);
  -webkit-text-fill-color: var(--ink);
  font-size: 16px;
}
.exercise input:focus { border-color: var(--ac); }
.exercise input::placeholder { color: var(--mute); -webkit-text-fill-color: var(--mute); }
.sug, .sugall {
  color: var(--ink);
  background: color-mix(in srgb, var(--ac) 10%, var(--paper));
  border-color: color-mix(in srgb, var(--ac) 38%, var(--paper));
}
.sug span, .save, .settings .install {
  color: #1c2512;
  background: var(--lime);
  box-shadow: none;
}
.mini, .hint { color: var(--mute); }
.settings { padding-top: 24px; }
.settings .danger { color: #ffabac; }
.srow b { font-variant-numeric: tabular-nums; }
.keypad-panel { color: var(--ink); border: 1px solid var(--line); }
.keypad-display, .keypad-grid button, .keypad-grid .key-del, .keypad-actions button {
  color: var(--ink);
  background: var(--panel);
  border-color: var(--line);
  box-shadow: none;
}
.keypad-grid button:active { background: #39443b; }
.keypad-actions .key-done {
  background: var(--lime) !important;
  color: #1c2512;
  box-shadow: none;
}
button, .filebtn { cursor: pointer; }
button:focus-visible, input:focus-visible, .filebtn:focus-within {
  outline: 2px solid var(--lime);
  outline-offset: 3px;
}
@media (hover: hover) {
  .workcard:hover { transform: translateY(-3px); border-color: var(--accent); }
  .settings button:hover, .filebtn:hover { border-color: var(--lime); }
}
@media (min-width: 700px) {
  .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .workcard {
    min-height: 192px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-content: space-between;
    font-size: 25px;
  }
  .workcard .emoji { grid-column: 1 / -1; }
  .paper {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    align-items: start;
    gap: 12px;
  }
  .exercise { margin: 0; }

      <label class="chart-filter">Lịch tập <select data-chart="volume">${option('all', 'Tất cả', group)}${Object.keys(routines).map(r => option(r, cap(r), group)).join('')}</select></label>
      <p class="hint">Kg × tổng rep. Một số rep được nhân với số set. Dạng 8/10/10 cộng từng set. Chỉ tính bài có tạ và tổng rep xác định được.</p>
      ${chartBars(volumePoints, 'Chưa có buổi đủ dữ liệu để tính volume.')}
      ${volumePoints.length ? '<p class="hint">Tổng volume: <strong>' + chartNumber.format(volumePoints.reduce((sum, point) => sum + point.value, 0)) + '</strong> kg × rep</p>' : ''}
    </section>
    <section class="analytics-panel" style="--chart-accent:${colors[track]}" aria-labelledby="progress-title">
      <h2 id="progress-title">Tăng tiến theo bài</h2>
      <p class="hint">30 ngày · ${periodLabel}</p>
      <label class="chart-filter">Bài tập <select data-chart="exercise">${Object.entries(routines).map(([r, names]) => '<optgroup label="' + cap(r) + '">' + names.map((name, i) => option(r + ':' + i, name, analyticsFilters.exercise)).join('') + '</optgroup>').join('')}</select></label>
      <label class="chart-filter">Chỉ số <select data-chart="metric">${option('weight', 'Mức tạ (kg)', metric)}${option('reps', 'Rep thấp nhất mỗi set', metric)}</select></label>
      ${chartBars(points, 'Chưa có số liệu cho chỉ số này trong 30 ngày.')}
      ${current ? '<p class="progress-summary">Gần nhất <strong>' + chartNumber.format(current.value) + ' ' + unit + '</strong> · ' + fmt(current.day) + (first ? '<br>So với buổi đầu kỳ ' + fmt(first.day) + ': <strong>' + (delta > 0 ? '+' : '') + chartNumber.format(delta) + ' ' + unit + '</strong>' : '') + '</p>' : ''}
      ${target ? '<p class="progress-target"><strong>Gợi ý buổi sau</strong><br>' + (target.set ? esc(target.set) + ' set · ' : '') + esc(target.rep) + ' rep · ' + (target.kg ? esc(target.kg) + ' kg' : 'tạ thân') + '</p>' : ''}
    </section>
  </div>`;
}

document.addEventListener('change', event => {
  const filter = event.target.dataset.chart;
  if (!Object.hasOwn(analyticsFilters, filter)) return;
  analyticsFilters[filter] = event.target.value;
  document.querySelector('.analytics').outerHTML = analytics();
  document.querySelector('[data-chart="' + filter + '"]').focus({ preventScroll: true });
});
function render(){({home,work,stats,settings,nutrition}[view]||home)()}/* deferred render */

// Inputs are read-only on purpose: use our 0–9 keypad instead of the phone keyboard.
let keypadInput=null;
function closeKeypad(){document.getElementById('gymKeypad')?.remove();keypadInput=null}
function openKeypad(el){
 if(keypadInput===el)return;
 closeKeypad();keypadInput=el;
 const row=el.closest('.exercise');const name=row?.querySelector('label')?.textContent||'Bài tập';
 const field=el.getAttribute('aria-label')||'';
 const modal=document.createElement('div');modal.id='gymKeypad';modal.className='keypad-overlay';
 modal.innerHTML=`<div class="keypad-panel" role="dialog" aria-modal="true" aria-label="Bàn phím nhập số"><div class="keypad-top"><div><div class="keypad-title">${esc(name)}</div><div class="keypad-sub">${esc(field.startsWith('Số set')?'Số set':field.startsWith('Số rep')?'Số rep':'Mức tạ (kg)')}</div></div><button class="keypad-close" type="button" data-key="done" aria-label="Đóng">×</button></div><div class="keypad-display" id="keypadValue"></div><div class="keypad-grid">${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(x=>`<button type="button" data-key="${x==='⌫'?'back':x}" class="${x==='⌫'?'key-del':''}">${x}</button>`).join('')}</div><div class="keypad-actions"><button type="button" data-key="clear">Xóa hết</button><button type="button" class="key-done" data-key="done" style="background:#287de9;color:white">✓ Xong</button></div></div>`;
 modal.addEventListener('click',e=>{if(e.target===modal)closeKeypad()});
 modal.querySelectorAll('[data-key]').forEach(btn=>btn.addEventListener('click',()=>keypadPress(btn.dataset.key)));
 document.body.append(modal);updateKeypadDisplay();
}
function updateKeypadDisplay(){const display=document.getElementById('keypadValue');if(display)display.textContent=keypadInput?.value||'—'}
function keypadPress(k){if(!keypadInput)return;navigator.vibrate?.(8);if(k==='done'){closeKeypad();return}
 let v=keypadInput.value;
 if(k==='clear')v='';else if(k==='back')v=v.slice(0,-1);else if(k==='.') {if(!v.includes('.'))v=(v||'0')+'.'}else if(/^\d$/.test(k)&&v.length<9)v+=k;
 keypadInput.value=v;keypadInput.dispatchEvent(new Event('input',{bubbles:true}));updateKeypadDisplay();
}
document.addEventListener('click',e=>{const el=e.target.closest?.('.exercise input[readonly]');if(el)openKeypad(el)});
document.addEventListener('keydown',e=>{if(!keypadInput)return;if(e.key==='Escape'){closeKeypad();return}if(e.key==='Backspace'){keypadPress('back');return}if(e.key==='Enter'){closeKeypad();return}if(/^[0-9.]$/.test(e.key))keypadPress(e.key)});
document.addEventListener('input',e=>{const row=e.target.closest?.('.exercise');if(!row)return;row.classList.toggle('done',[...row.querySelectorAll('input')].some(x=>x.value.trim()));const n=document.querySelectorAll('.exercise.done').length,t=document.querySelector('.tprog');if(t){t.querySelector('span').textContent=n+'/8 bài đã ghi';t.querySelector('u').style.width=n*12.5+'%'}});
document.addEventListener('click',e=>{const b=e.target.closest?.('.sug');if(!b)return;const row=b.closest('.exercise'),s=suggest(prev(routine,+row.dataset.i));if(!s)return;const ins=row.querySelectorAll('input');[s.set,s.rep,s.kg].forEach((v,k)=>{if(v!==''&&v!=null){ins[k].value=v;ins[k].dispatchEvent(new Event('input',{bubbles:true}))}})});
let dip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e});
function installed(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone}
function installApp(){if(dip){dip.prompt();dip=null}else alert('iPhone (Safari): nút Chia sẻ → Thêm vào MH chính.\nAndroid (Chrome): menu ⋮ → Cài đặt ứng dụng / Thêm vào màn hình chính.')}
function exportJSON(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='DZ-Gym-Log-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importJSON(f){if(!f)return;f.text().then(t=>{try{const x=JSON.parse(t);if(!x||typeof x!=='object')throw 0;Object.assign(data,x);persist();alert('Đã khôi phục dữ liệu');render()}catch{alert('File sao lưu không hợp lệ')}})}

navigator.storage?.persist?.();

const loadE=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}};
let ep={sex:5,age:20,height:179,weight:62,goal:70,days:90,activity:1.35,...loadE('dzEnergyProfile',{})}, meals=loadE('dzcalolog',{}), gym=loadE('dzGymEnergy',{});
function saveE(){localStorage.setItem('dzEnergyProfile',JSON.stringify(ep));localStorage.setItem('dzcalolog',JSON.stringify(meals));localStorage.setItem('dzGymEnergy',JSON.stringify(gym))}
const enFmt=(n,d=0)=>Number(n).toLocaleString('vi-VN',{maximumFractionDigits:d});const et=(a,b)=>`<div class="etile"><small>${a}</small><b>${b}</b></div>`;
function baseE(){return (10*ep.weight+6.25*ep.height-5*ep.age+ep.sex)*ep.activity}function burn(x){return Math.max(0,(x.met-1)*3.5*x.weight/200*x.minutes)}function dayBurn(d){return Object.entries(gym).filter(([k])=>k.endsWith('_'+d)).reduce((a,[k,x])=>a+burn(x),0)}function extraE(){return (ep.goal-ep.weight)*7700/ep.days}function targetE(d){return baseE()+dayBurn(d)+extraE()}
function profilePanel(){return `<section class="energy"><h2>BODY PROFILE</h2><form onsubmit="saveProfile(event)"><div class="energygrid">${[['age','Tuổi',18,100],['height','Chiều cao cm',100,250],['weight','Cân nặng kg',30,300],['goal','Mục tiêu kg',30,300],['days','Thời gian ngày',1,3650]].map(([k,t,min,max])=>`<label>${t}<input name="${k}" type="number" min="${min}" max="${max}" step="any" required value="${ep[k]}"></label>`).join('')}<label>Giới tính<select name="sex"><option value="5" ${ep.sex===5?'selected':''}>Nam</option><option value="-161" ${ep.sex===-161?'selected':''}>Nữ</option></select></label></div><label>Vận động ngoài gym<select name="activity">${[[1.2,'Ít vận động'],[1.35,'Đi lại nhẹ'],[1.5,'Đi lại nhiều'],[1.7,'Lao động nặng']].map(([v,t])=>`<option value="${v}" ${ep.activity===v?'selected':''}>${t}</option>`).join('')}</select></label><button>Lưu hồ sơ</button></form><div class="energygrid">${et('BMR',enFmt(baseE()/ep.activity))}${et('TDEE ngoài gym',enFmt(baseE()))}${et('Calo cần ăn hôm nay',enFmt(targetE(todayStr())))}${et('Protein tham khảo',enFmt(ep.weight*1.6)+'–'+enFmt(ep.weight*2.2)+' g')}</div><p class="hint">Mục tiêu chênh lệch ${enFmt(extraE())} kcal/ngày. ${Math.abs(extraE())>750?'Mục tiêu khá gấp; nên kéo dài thời gian.':''} TDEE nền không gồm gym.</p></section>`}
function saveProfile(e){e.preventDefault();for(const [k,v] of new FormData(e.target))ep[k]=Number(v);saveE();render()}
function gymPanel(){let x=gym[routine+'_'+date]||{minutes:60,met:3.5};return `<section class="energy"><h2>GYM ENERGY</h2><form onsubmit="saveGym(event)"><label>Thời lượng cả buổi (phút, gồm nghỉ)<input name="minutes" type="number" min="1" max="300" required value="${x.minutes}"></label><label>Cường độ trung bình<select name="met">${[[3.5,'Tập tạ vừa · 3.5 MET'],[5,'Tập nặng · 5 MET'],[6,'Tập rất nặng · 6 MET']].map(([v,t])=>`<option value="${v}" ${x.met===v?'selected':''}>${t}</option>`).join('')}</select></label><button>Lưu calo buổi tập</button></form><div class="energygrid">${et('Calo gym ròng đã lưu',gym[routine+'_'+date]?enFmt(burn(gym[routine+'_'+date])):'—')}${et('Cần ăn hôm nay',enFmt(targetE(date)))}</div><button onclick="deleteGym()">Xóa calo buổi này</button><p class="hint">Ước tính MET theo thời lượng và cân nặng; không quy đổi trực tiếp volume tạ sang kcal. Chỉ cộng phần tiêu hao trên mức nghỉ.</p></section>`}
function saveGym(e){e.preventDefault();let f=new FormData(e.target);gym[routine+'_'+date]={minutes:+f.get('minutes'),met:+f.get('met'),weight:ep.weight};saveE();render()}function deleteGym(){delete gym[routine+'_'+date];saveE();render()}
function nutrition(){let d=todayStr(),a=meals[d];app.innerHTML=`<div class="dark header"><h1>NUTRITION</h1><p class="sub">Năng lượng & dưỡng chất</p></div><div class="settings"><section class="energy"><h2>HÔM NAY</h2><div class="energygrid">${et('TDEE nền',enFmt(baseE()))}${et('Gym ròng',enFmt(dayBurn(d)))}${et('TDEE hôm nay',enFmt(baseE()+dayBurn(d)))}${et('Cần ăn',enFmt(targetE(d)))}${et('Đã ăn',a?enFmt(a[0]):'—')}${et('Còn thiếu theo mục tiêu',a?enFmt(Math.max(0,targetE(d)-a[0])):'—')}${['Protein','Carb','Fat'].map((t,i)=>et(t,a?enFmt(a[i+1])+' g':'—')).join('')}</div></section><section class="energy"><h2>IMPORT TXT</h2><input type="file" accept=".txt,text/plain" onchange="readMeal(this)"><textarea id="mealRaw" placeholder="${d};2260;92;276;87"></textarea><button onclick="importMeal()">Nhập dữ liệu</button><button onclick="downloadE('mau-dinh-duong.txt','# Ngày;Calo;Protein;Carb;Fat\n'+todayStr()+';2260;92;276;87')">Tải mẫu TXT</button><button onclick="downloadE('nhat-ky.txt',Object.keys(meals).sort().map(k=>[k,...meals[k]].join(';')).join('\n'))">Xuất nhật ký</button><p class="hint">Ngày;Calo;Protein;Carb;Fat — macro tính bằng gram. Ngày trùng được cập nhật.</p><p id="mealMsg" role="status"></p></section><section class="energy"><h2>NHẬT KÝ</h2><table><thead><tr><th>Ngày</th><th>Kcal</th><th>P</th><th>C</th><th>F</th><th></th></tr></thead><tbody>${Object.keys(meals).sort().reverse().map(k=>`<tr><td>${esc(k)}</td>${meals[k].map(v=>`<td>${enFmt(v,1)}</td>`).join('')}<td><button onclick="removeMeal('${k}')">×</button></td></tr>`).join('')}</tbody></table></section></div>${footer('nutrition')}`}
async function readMeal(el){if(el.files[0])document.getElementById('mealRaw').value=await el.files[0].text()}function importMeal(){let pending={},errors=[];document.getElementById('mealRaw').value.split(/\r?\n/).forEach((l,i)=>{l=l.trim();if(!l||l.startsWith('#'))return;let [k,...v]=l.split(';').map(x=>x.trim());if(!/^\d{4}-\d\d-\d\d$/.test(k)||!Number.isFinite(Date.parse(k))||new Date(k).toISOString().slice(0,10)!==k||v.length!==4||v.some(x=>!x||!Number.isFinite(+x)||+x<0)){errors.push(i+1);return}pending[k]=v.map(Number)});if(errors.length||!Object.keys(pending).length){document.getElementById('mealMsg').textContent=errors.length?'Lỗi dòng '+errors.join(', '):'Chưa có dữ liệu';return}Object.assign(meals,pending);saveE();render();document.getElementById('mealMsg').textContent='Đã nhập '+Object.keys(pending).length+' ngày'}function removeMeal(k){if(confirm('Xóa ngày '+k+'?')){delete meals[k];saveE();render()}}function downloadE(n,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function energyForecast(){let end=todayStr(),start=new Date(end+'T12:00:00');start.setDate(start.getDate()-6);let keys=Object.keys(meals).filter(k=>k<=end&&Date.parse(k)>=Date.parse(end)-6*86400000),avg=keys.length?keys.reduce((s,k)=>s+meals[k][0],0)/keys.length:0,gavg=Object.entries(gym).filter(([k])=>{let d=k.slice(-10);return d<=end&&Date.parse(d)>=Date.parse(end)-6*86400000}).reduce((s,[k,x])=>s+burn(x),0)/7,t=baseE()+gavg,delta=(avg-t)/7700;return `<section class="energy"><h2>WEIGHT FORECAST</h2><div class="energygrid">${et('Gym TB / ngày',enFmt(gavg))}${et('TDEE TB / ngày',enFmt(t))}${et('Calo cần ăn TB',enFmt(t+extraE()))}${et('Calo ăn TB',keys.length?enFmt(avg):'—')}${[7,30].map(n=>et('Sau '+n+' ngày',keys.length?(delta>=0?'+':'')+enFmt(delta*n,2)+' kg':'—')).join('')}</div><p class="hint">${keys.length}/7 ngày ăn đã ghi. Gym lấy tổng 7 ngày chia 7; ngày chưa ghi gym được giả định nghỉ. Dự báo giả định tiếp tục mức ăn và vận động này, dùng 7.700 kcal/kg; không phải dự báo tăng cơ.</p></section>`}
render();
